name: Validation Checks
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  checks:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/install-node

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test

      - name: Run Type Check
        run: npm run typescript

      - name: Run Linter
        run: npm run lint

      - name: Run Formatter
        run: npm run format
